<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: bắt buộc để env(safe-area-inset-*) trả về số thật
         trên máy có tai thỏ. Phần chừa chỗ tương ứng nằm ở styles/mobile.css.
         Không đặt maximum-scale/user-scalable: người dùng phải phóng to được. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#385791" />
    <title>Ngoaingu3k Academy — Học ngoại ngữ trực tuyến</title>
    <meta
      name="description"
      content="Nền tảng e-learning tiếng Anh, tiếng Trung với lộ trình cá nhân hóa, giảng viên theo sát và theo dõi tiến độ rõ ràng."
    />
    <link rel="canonical" href="https://ngoaingu3k.com" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ngoaingu3k Academy — Học ngoại ngữ trực tuyến" />
    <meta property="og:description" content="Nền tảng e-learning tiếng Anh, tiếng Trung với lộ trình cá nhân hóa, giảng viên theo sát và theo dõi tiến độ rõ ràng." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ngoaingu3k.com" />
    <meta property="og:image" content="/images/imported/hsk-cover.png" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Ngoaingu3k Academy" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ngoaingu3k Academy — Học ngoại ngữ trực tuyến" />
    <meta name="twitter:description" content="Nền tảng e-learning tiếng Anh, tiếng Trung với lộ trình cá nhân hóa." />
    <meta name="twitter:image" content="/images/imported/hsk-cover.png" />
    <!-- Nunito: font của cả ngoaingu3k.com (400 thân bài · 700 nav · 900 tiêu
         đề). Nạp dạng biến thiên 400..900 vì CSS app có dùng các nấc lẻ 650,
         750, 850 — bản tĩnh sẽ làm trình duyệt tự bôi đậm, ra nét bệt. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Supabase là nơi lấy dữ liệu khoá học ngay khi app khởi động, và cũng
         là nơi phục vụ ảnh banner. Preconnect để lần gọi đầu khỏi tốn một
         vòng DNS + TLS. Không preload ảnh hero ở đây: index.html này dùng
         chung cho mọi route nên /courses, /dashboard... sẽ tải thừa 135KB
         ảnh không bao giờ hiển thị. Ảnh hero được ưu tiên bằng
         fetchpriority="high" ngay tại thẻ img của trang chủ. -->
    <link rel="preconnect" href="https://yhycvbjambzxdrgmxrhr.supabase.co" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&display=swap"
      rel="stylesheet"
    />

    <!-- favicon.svg chỉ là chính favicon.png bọc trong thẻ <image> base64 (so
         byte đã xác nhận trùng khít), nên khai báo cả hai làm trình duyệt tải
         về 175KB cho một cái icon 128px. Giữ lại bản PNG: icon hiện ra y hệt. -->
    <link rel="icon" href="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
